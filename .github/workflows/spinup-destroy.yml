name: Manage staging environment

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-productcatalog-staging
  AZURE_LOCATION: westus3
  AZURE_PLAN: asp-productcatalog-staging
  AZURE_ACR_NAME: acrproductcatalogilyas
  AZURE_ACR_RESOURCE_GROUP: rg-productcatalog-dev
  AZURE_REGISTRY: acrproductcatalogilyas.azurecr.io
  AZURE_BACKEND_APP: app-productcatalog-backend-staging
  AZURE_FRONTEND_APP: app-productcatalog-frontend-staging
  AZURE_PG_HOST: pg-productcatalog-ilyas.postgres.database.azure.com
  AZURE_PG_USER: catalogadmin
  AZURE_PG_DB: product_catalog

jobs:
  spin-up:
    name: Create staging environment
    if: contains(github.event.pull_request.labels.*.name, 'spin up environment')
    runs-on: ubuntu-latest

    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group and App Service plan
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION"

          az appservice plan create \
            --name "$AZURE_PLAN" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --is-linux \
            --sku B1

      - name: Create staging Web Apps
        run: |
          az webapp create \
            --name "$AZURE_BACKEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --plan "$AZURE_PLAN" \
            --deployment-container-image-name nginx:alpine

          az webapp create \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --plan "$AZURE_PLAN" \
            --deployment-container-image-name nginx:alpine

      - name: Give staging apps access to ACR
        run: |
          acr_id=$(az acr show \
            --name "$AZURE_ACR_NAME" \
            --resource-group "$AZURE_ACR_RESOURCE_GROUP" \
            --query id \
            --output tsv)

          for app in "$AZURE_BACKEND_APP" "$AZURE_FRONTEND_APP"; do
            principal_id=$(az webapp identity assign \
              --name "$app" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query principalId \
              --output tsv)

            existing_assignment=$(az role assignment list \
              --assignee-object-id "$principal_id" \
              --scope "$acr_id" \
              --role AcrPull \
              --query "[0].id" \
              --output tsv)

            if [ -z "$existing_assignment" ]; then
              az role assignment create \
                --assignee-object-id "$principal_id" \
                --assignee-principal-type ServicePrincipal \
                --role AcrPull \
                --scope "$acr_id"
            fi
          done

      - name: Configure staging containers and settings
        env:
          AZURE_PG_PASSWORD: ${{ secrets.AZURE_PG_PASSWORD }}
        run: |
          if [ -z "$AZURE_PG_PASSWORD" ]; then
            echo "The AZURE_PG_PASSWORD secret is missing."
            exit 1
          fi

          az webapp config container set \
            --name "$AZURE_BACKEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-image-name "$AZURE_REGISTRY/product-catalog-backend:v2" \
            --container-registry-url "https://$AZURE_REGISTRY"

          az webapp config container set \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-image-name "$AZURE_REGISTRY/product-catalog-frontend:v2" \
            --container-registry-url "https://$AZURE_REGISTRY"

          az webapp config set \
            --name "$AZURE_BACKEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --generic-configurations '{"acrUseManagedIdentityCreds":true}'

          az webapp config set \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --generic-configurations '{"acrUseManagedIdentityCreds":true}'

          frontend_host=$(az webapp show \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query defaultHostName \
            --output tsv)

          az webapp config appsettings set \
            --name "$AZURE_BACKEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings \
              WEBSITES_PORT=8080 \
              SPRING_DATASOURCE_URL="jdbc:postgresql://$AZURE_PG_HOST:5432/$AZURE_PG_DB?sslmode=require" \
              SPRING_DATASOURCE_USERNAME="$AZURE_PG_USER" \
              SPRING_DATASOURCE_PASSWORD="$AZURE_PG_PASSWORD" \
              APP_FRONTEND_ORIGIN="https://$frontend_host"

          az webapp config appsettings set \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings WEBSITES_PORT=80

      - name: Restart staging apps
        run: |
          az webapp restart --name "$AZURE_BACKEND_APP" --resource-group "$AZURE_RESOURCE_GROUP"
          az webapp restart --name "$AZURE_FRONTEND_APP" --resource-group "$AZURE_RESOURCE_GROUP"

  destroy:
    name: Delete staging environment
    if: contains(github.event.pull_request.labels.*.name, 'destroy environment')
    runs-on: ubuntu-latest

    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete staging resource group
        run: |
          az group delete \
            --name "$AZURE_RESOURCE_GROUP" \
            --yes \
            --no-wait
