name: Deploy to staging

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-productcatalog-staging
  AZURE_ACR_NAME: acrproductcatalogilyas
  AZURE_REGISTRY: acrproductcatalogilyas.azurecr.io
  AZURE_BACKEND_APP: app-productcatalog-backend-staging
  AZURE_FRONTEND_APP: app-productcatalog-frontend-staging
  AZURE_PG_HOST: pg-productcatalog-ilyas.postgres.database.azure.com
  AZURE_PG_USER: catalogadmin
  AZURE_PG_DB: product_catalog
  IMAGE_TAG: ${{ github.event.pull_request.head.sha }}

jobs:
  deploy:
    name: Build and deploy staging
    if: contains(github.event.pull_request.labels.*.name, 'stage')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: product_catalog
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d product_catalog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Test backend
        working-directory: Backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/product_catalog
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress verify

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Read staging backend URL
        run: |
          backend_host=$(az webapp show \
            --name "$AZURE_BACKEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query defaultHostName \
            --output tsv)
          echo "BACKEND_HOST=$backend_host" >> "$GITHUB_ENV"

      - name: Configure frontend for staging
        run: |
          sed -i -E "s#https://[^']+/api/products#https://${BACKEND_HOST}/api/products#g" \
            Frontend/src/app/services/product-service.ts
          sed -i -E "s#https://[^']+/api/auth/login#https://${BACKEND_HOST}/api/auth/login#g" \
            Frontend/src/app/services/login-service.ts

      - name: Build frontend
        working-directory: Frontend
        run: |
          npm ci
          npm run build

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$AZURE_ACR_NAME"

      - name: Build and push backend image
        run: |
          docker build \
            --tag "$AZURE_REGISTRY/product-catalog-backend:$IMAGE_TAG" \
            ./Backend
          docker push "$AZURE_REGISTRY/product-catalog-backend:$IMAGE_TAG"

      - name: Build and push frontend image
        run: |
          docker build \
            --tag "$AZURE_REGISTRY/product-catalog-frontend:$IMAGE_TAG" \
            ./Frontend
          docker push "$AZURE_REGISTRY/product-catalog-frontend:$IMAGE_TAG"

      - name: Configure backend staging container
        env:
          AZURE_PG_PASSWORD: ${{ secrets.AZURE_PG_PASSWORD }}
        run: |
          if [ -z "$AZURE_PG_PASSWORD" ]; then
            echo "The AZURE_PG_PASSWORD secret is missing."
            exit 1
          fi

          az webapp config container set \
            --name "$AZURE_BACKEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-image-name "$AZURE_REGISTRY/product-catalog-backend:$IMAGE_TAG" \
            --container-registry-url "https://$AZURE_REGISTRY"

          az webapp config set \
            --name "$AZURE_BACKEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --generic-configurations '{"acrUseManagedIdentityCreds":true}'

          frontend_host=$(az webapp show \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query defaultHostName \
            --output tsv)

          az webapp config appsettings set \
            --name "$AZURE_BACKEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings \
              WEBSITES_PORT=8080 \
              SPRING_DATASOURCE_URL="jdbc:postgresql://$AZURE_PG_HOST:5432/$AZURE_PG_DB?sslmode=require" \
              SPRING_DATASOURCE_USERNAME="$AZURE_PG_USER" \
              SPRING_DATASOURCE_PASSWORD="$AZURE_PG_PASSWORD" \
              APP_FRONTEND_ORIGIN="https://$frontend_host"

      - name: Configure frontend staging container
        run: |
          az webapp config container set \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --container-image-name "$AZURE_REGISTRY/product-catalog-frontend:$IMAGE_TAG" \
            --container-registry-url "https://$AZURE_REGISTRY"

          az webapp config set \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --generic-configurations '{"acrUseManagedIdentityCreds":true}'

          az webapp config appsettings set \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --settings WEBSITES_PORT=80

      - name: Restart staging apps
        run: |
          az webapp restart --name "$AZURE_BACKEND_APP" --resource-group "$AZURE_RESOURCE_GROUP"
          az webapp restart --name "$AZURE_FRONTEND_APP" --resource-group "$AZURE_RESOURCE_GROUP"
