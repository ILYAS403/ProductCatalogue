<section class="product-list">

  <div class="header">
    <h1>Products ({{ products.length }})</h1>
  </div>

  <div class="search-bar">
    <input
      type="text"
      [(ngModel)]="searchQuery"
      placeholder="Search by name or id "
      (keyup.enter)="search()"
    />

    <button (click)="search()">
      Search
    </button>
  </div>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Price</th>
        <th>Created At</th>
      </tr>
    </thead>

    <tbody>
      @for (product of products; track product.id) {
        <tr>
          <td>{{ product.id }}</td>
          <td>{{ product.name }}</td>
          <td>{{ product.category }}</td>
          <td>{{ product.price }} €</td>
          <td>{{ product.createdAt }}</td>
        </tr>
      }
    </tbody>
  </table>

</section>
